## ESP-IDF Component Manager manifest.
## esp_websocket_client lives in the component registry since ESP-IDF v5.0; it is
## downloaded automatically into managed_components/ on the first build.
## >=1.7.0 is required for task_core_id (the WebSocket task is pinned to core 1).
dependencies:
  idf:
    version: ">=5.3.0"
  espressif/esp_websocket_client:
    version: "^1.7.0"
